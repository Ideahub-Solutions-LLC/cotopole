name: cotopole
description: >-
  Cotopole — offline-first event lead capture for iOS and Android.
  Snap a business card, read it on-device, review, and save to a local
  SQLite database. No cloud database.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

  # Local database (SQLite only — no online database)
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # Capture & on-device recognition (works offline on iOS and Android)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  share_plus: ^11.0.0

  # Motion
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#060918"
  image: assets/images/cotople_logo.png
  android_12:
    color: "#060918"
    image: assets/icon/app_icon_foreground.png
  ios: true
  android: true
  web: false
  fullscreen: false
